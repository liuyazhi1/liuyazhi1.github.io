title: 钱钱的博客
subtitle: 记录学习，分享成长
description: 个人技术博客，分享学习笔记、项目经验和生活感悟
keywords: 技术博客,学习笔记,项目展示,前端开发
author: 钱钱
avatar: https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20kawaii%20anime%20style%20avatar%20portrait%20soft%20pastel%20morandi%20color%20dusty%20pink%20cream%20aesthetic%20simple%20clean%20design&image_size=square_hd
language: zh-CN
timezone: Asia/Shanghai

url: https://liuyazhi1.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: stellar

deploy:
  type: 'git'
  repo: https://github.com/liuyazhi1/liuyazhi1.github.io.git
  branch: main