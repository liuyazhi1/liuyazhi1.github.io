comments:
  service:
  comment_title: 快来参与讨论吧~
  lazyload: false
  giscus:
    src: https://giscus.app/client.js
    data-repo: liuyazhi1/liuyazhi1.github.io
    data-repo-id: # 访问 https://giscus.app/zh-CN 配置后获取
    data-category: Comments
    data-category-id: # 访问 https://giscus.app/zh-CN 配置后获取
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: bottom
    data-theme: dark
    data-lang: zh-CN
    crossorigin: anonymous

inject:
  head:
    - '<link rel="stylesheet" href="/css/scrapbook-tokens.css">'
    - '<link rel="stylesheet" href="/css/scrapbook-article.css">'
  script:
    - '<script src="/js/scrapbook-space.js" defer></script>'

style:
  prefers_theme: light
  smooth_scroll: true
  font-size:
    root: 16px
    body: 17px
  color:
    theme: '#E8A598'
    accent: '#A8C5B0'
    link: '#C9A87C'
  border-radius:
    card-l: 24px
    card: 20px
    card-s: 16px
    bar: 32px
    image-l: 24px
    image: 20px
    image-s: 16px
