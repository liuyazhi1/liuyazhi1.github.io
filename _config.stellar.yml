site_tree:
  home:
    leftbar: welcome
    rightbar: recent
  index_blog:
    base_dir: blog
    menu_id: post
    leftbar: welcome
    rightbar: recent
  index_wiki:
    base_dir: wiki
    menu_id: wiki
    leftbar: tree, related
    rightbar:
  post:
    menu_id: post
    leftbar: related
    rightbar: toc
  wiki:
    menu_id: wiki
    leftbar: tree, related
    rightbar: toc
  page:
    leftbar:
    rightbar: toc

article:
