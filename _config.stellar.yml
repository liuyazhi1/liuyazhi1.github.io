  share: [wechat, weibo, email, link]

search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true

footer:
  social:
    github:
      icon: '<i class="fab fa-github"></i>'
      url: https://github.com/liuyazhi1
    email:
      icon: '<i class="fas fa-envelope"></i>'
      url: mailto:2698669434@qq.com
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
